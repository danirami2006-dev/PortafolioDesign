<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Piezas gráficas | Portafolio</title>
    <link rel="icon" type="image/x-icon" href="img/icono.ico"> 
    <!-- Vinculamos tu CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
        
        <!-- BANNER PRINCIPAL (VIDEO + LATERALES) -->
       <section class="banner-principal">
    
    <!-- PNG IZQUIERDO: PORTAFOLIO -->
    <img src="img/por.png" alt="Portafolio" class="png-superpuesto png-portafolio">
    <img src="img/dis.png" alt="Diseño" class="png-superpuesto png-diseno">

    <!-- CONTENEDOR DEL VIDEO CENTRAL -->
   <div class="contenedor-video-banner">
    <!-- Video 1: Empieza visible -->
    <video id="video1" autoplay muted playsinline class="video-destacado video-activo">
        <source src="video/banner1.mp4" type="video/mp4">
    </video>

    <!-- Video 2: Oculto inicialmente, pero ya cargado -->
    <video id="video2" muted playsinline class="video-destacado video-oculto">
        <source src="video/banner2.mp4" type="video/mp4">
    </video>
</div>

  
</section>

    <!-- SECCIÓN CONÓCEME -->
<section class="seccion-conoceme" id="conoceme">
    <div class="contenedor-conoceme">
        
        <!-- Columna Izquierda: Tu foto -->
        <div class="columna-foto-conoceme">
            <img src="img/fotodesigner.jpg" class="foto-designer" alt="Foto Diseñadora">
        </div>

        <!-- Columna Derecha: Cuadro de texto + Contenido -->
        <div class="columna-texto-conoceme">
            <div class="contenedor-cuadro-texto">
                <!-- Imagen de fondo del cuadro de texto -->
                <img src="img/text.png" class="imagen-cuadro-fondo" alt="Fondo de texto">
                
                <!-- Texto superpuesto dentro del cuadro -->
                <div class="contenido-texto-conoceme">
                    <h2>CONÓCEME</h2>
                    <p>
                        ¡Hola! Me llamo Daniela, Soy diseñadora gráfica e ilustradora digital apasionada por la creación de contenido visual, branding, ilustración y desarrollo web. Me especializo en combinar estéticas únicas como la moda urbana japonesa, subculturas anime y diseño editorial.
                    </p>
                </div>
            </div>
        </div>

    </div>
</section>
        <!-- Aquí irán tus imágenes de ilustraciones más abajo -->
    </main>

    <!-- Conexión con tu archivo JavaScript para que cambie los videos -->
    <script src="JS/script.js"></script>

</body>
</html>
